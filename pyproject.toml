[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jobagg"
version = "0.1.0"
description = "Recherche simultanée d'offres d'emploi sur LinkedIn, HelloWork, Welcome to the Jungle, France Travail, APEC et Adzuna"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["requests>=2.28", "beautifulsoup4>=4.11", "lxml>=4.9"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
jobagg = "jobagg.cli:main"
jobagg-web = "jobagg.web:main"

[tool.setuptools.packages.find]
include = ["jobagg*"]

[tool.setuptools.package-data]
jobagg = ["static/*.html"]
